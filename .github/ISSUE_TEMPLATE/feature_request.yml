name: Feature request
description: Suggest a focused improvement that fits the InteractEmbed block
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the teaching, administration, accessibility or privacy need rather than only the proposed interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: The request belongs in a Moodle block and does not require grades or activity completion.
          required: true
        - label: I considered accessibility, privacy and Moodle 4.5–5.2 compatibility.
          required: true
